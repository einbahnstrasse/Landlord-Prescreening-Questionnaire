document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

transparent 60%),\n      var(--bg);\n    color: var(--ink);\n    -webkit-font-smoothing: antialiased;\n    line-height: 1.5;\n  }\n\n  /* ---------- App shell ---------- */\n  .app {\n    min-height: 100%;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n  }\n\n  .topbar {\n    position: sticky;\n    top: 0;\n    z-index: 20;\n    width: 100%;\n    background: oklch(98.6% 0.004 250 / .82);\n    backdrop-filter: saturate(1.4) blur(10px);\n    border-bottom: 1px solid var(--line);\n  }\n  .topbar-inner {\n    max-width: 720px;\n    margin: 0 auto;\n    padding: 14px 24px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n  }\n  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }\n  .mark {\n    width: 26px; height: 26px; border-radius: 7px;\n    background: var(--ink);\n    color: #fff;\n    display: grid; place-items: center;\n    font-family: var(--mono); font-weight: 600; font-size: 13px;\n    flex: none;\n    letter-spacing: -.02em;\n  }\n  .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }\n  .brand-text b { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; white-space: nowrap; }\n  .brand-text span { font-size: 11px; color: var(--muted); white-space: nowrap; }\n  .step-meta {\n    font-family: var(--mono);\n    font-size: 11.5px;\n    color: var(--muted);\n    letter-spacing: .02em;\n    white-space: nowrap;\n  }\n  .progress-track {\n    height: 3px; width: 100%;\n    background: var(--line);\n  }\n  .progress-fill {\n    height: 100%; width: 0%;\n    background: var(--accent);\n    transition: width .5s cubic-bezier(.4,.1,.2,1);\n  }\n\n  /* ---------- Stage ---------- */\n  .stage {\n    width: 100%;\n    max-width: 720px;\n    padding: 30px 24px 96px;\n    flex: 1;\n  }\n\n  .panel { display: none; animation: rise .42s cubic-bezier(.2,.7,.2,1) both; }\n  .panel.active { display: block; }\n  @keyframes rise {\n    from { opacity: 0; transform: translateY(10px); }\n    to   { opacity: 1; transform: none; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .panel { animation: none; }\n    .progress-fill { transition: none; }\n  }\n\n  /* ---------- Intro ---------- */\n  .eyebrow {\n    font-family: var(--mono);\n    font-size: 11.5px;\n    letter-spacing: .14em;\n    text-transform: uppercase;\n    color: var(--accent);\n    margin: 8px 0 18px;\n  }\n  .intro h1 {\n    font-size: clamp(28px, 4.6vw, 40px);\n    line-height: 1.08;\n    letter-spacing: -.025em;\n    font-weight: 700;\n    margin: 0 0 20px;\n    text-wrap: balance;\n  }\n  .lede {\n    font-size: 16.5px;\n    color: var(--ink-soft);\n    max-width: 60ch;\n    margin: 0 0 16px;\n  }\n  .lede strong { color: var(--ink); font-weight: 600; }\n  .rule { height: 1px; background: var(--line); margin: 28px 0; border: 0; }\n  .meta-row {\n    display: flex; flex-wrap: wrap; gap: 10px;\n    margin: 0 0 30px;\n  }\n  .chip {\n    display: inline-flex; align-items: center; gap: 7px;\n    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);\n    background: var(--surface);\n    border: 1px solid var(--line-2);\n    border-radius: 999px;\n    padding: 7px 13px;\n  }\n  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); font-style: normal; }\n\n  /* ---------- Section header ---------- */\n  .sec-head { margin-bottom: 26px; }\n  .sec-kicker {\n    font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em;\n    text-transform: uppercase; color: var(--accent);\n    display: flex; align-items: center; gap: 10px;\n    margin-bottom: 12px;\n  }\n  .sec-kicker .ix { color: var(--faint); }\n  .sec-head h2 {\n    font-size: 25px; letter-spacing: -.02em; font-weight: 650; margin: 0 0 6px;\n  }\n  .sec-head p { margin: 0; color: var(--muted); font-size: 14.5px; }\n\n  /* ---------- Question card ---------- */\n  .q { padding: 22px 0; border-top: 1px solid var(--line); }\n  .q:first-of-type { border-top: 0; padding-top: 4px; }\n  .q-label {\n    display: flex; gap: 12px; align-items: baseline;\n    font-size: 16px; font-weight: 550; letter-spacing: -.01em;\n    margin-bottom: 4px;\n  }\n  .q-num {\n    font-family: var(--mono); font-size: 12.5px; color: var(--faint);\n    font-weight: 500; flex: none; padding-top: 2px; min-width: 22px;\n  }\n  .q-body { flex: 1; min-width: 0; }\n  .q-help { font-size: 13.5px; color: var(--muted); margin: 2px 0 14px; }\n  .opt-mark { color: var(--faint); font-weight: 500; font-size: 13px; font-family: var(--mono); }\n\n  /* ---------- Text inputs ---------- */\n  .field {\n    width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink);\n    background: var(--surface);\n    border: 1px solid var(--line-2);\n    border-radius: 11px;\n    padding: 12px 14px;\n    transition: border-color .15s, box-shadow .15s, background .15s;\n    resize: vertical;\n  }\n  textarea.field { min-height: 92px; line-height: 1.5; }\n  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  @media (max-width: 540px) { .grid2 { grid-template-columns: 1fr; } }\n  .field::placeholder { color: var(--faint); }\n  .field:hover { border-color: var(--faint); }\n  .field:focus {\n    outline: none; border-color: var(--accent);\n    box-shadow: 0 0 0 3.5px var(--accent-sf);\n    background: #fff;\n  }\n\n  /* ---------- Segmented / choice controls ---------- */\n  .choices { display: flex; flex-wrap: wrap; gap: 9px; }\n  .choices.col { flex-direction: column; align-items: stretch; }\n  .opt {\n    position: relative;\n    display: inline-flex; align-items: center; gap: 9px;\n    border: 1px solid var(--line-2);\n    background: var(--surface);\n    border-radius: 10px;\n    padding: 10px 15px;\n    font-size: 14.5px; color: var(--ink-soft);\n    cursor: pointer;\n    transition: border-color .14s, background .14s, color .14s, box-shadow .14s;\n    user-select: none;\n  }\n  .opt:hover { border-color: var(--faint); background: oklch(99% 0.003 264); }\n  .opt input { position: absolute; opacity: 0; pointer-events: none; }\n  .opt .dot {\n    width: 16px; height: 16px; border-radius: 50%; flex: none;\n    border: 1.5px solid var(--line-2);\n    transition: border-color .14s, background .14s, box-shadow .14s;\n  }\n  .opt.check .dot { border-radius: 5px; }\n  .opt:has(input:checked) {\n    border-color: var(--accent);\n    background: var(--accent-sf);\n    color: var(--accent-h);\n    font-weight: 550;\n  }\n  .opt:has(input:checked) .dot {\n    border-color: var(--accent);\n    background: var(--accent);\n    box-shadow: inset 0 0 0 3px #fff;\n  }\n  .opt.check:has(input:checked) .dot { box-shadow: inset 0 0 0 2.5px #fff; }\n  .opt:has(input:focus-visible) { box-shadow: 0 0 0 3.5px var(--accent-sf); }\n\n  /* yes/no compact pair */\n  .yn .opt { min-width: 96px; justify-content: center; }\n\n  /* ---------- Scale 1–10 ---------- */\n  .scale { display: flex; flex-wrap: wrap; gap: 7px; }\n  .scale .opt {\n    width: 42px; height: 42px; padding: 0;\n    justify-content: center;\n    font-family: var(--mono); font-size: 14px;\n  }\n  .scale-ends {\n    display: flex; justify-content: space-between;\n    font-size: 12px; color: var(--muted); margin-top: 10px;\n    font-family: var(--mono);\n  }\n\n  /* ---------- Conditional reveal ---------- */\n  .reveal { display: none; margin-top: 12px; }\n  .reveal.show { display: block; animation: rise .3s ease both; }\n\n  /* ---------- Certification ---------- */\n  .certify {\n    margin-top: 26px;\n    background: var(--surface);\n    border: 1px solid var(--line-2);\n    border-radius: var(--radius);\n    padding: 18px 20px;\n    display: flex; gap: 14px; align-items: flex-start;\n  }\n  .certify .box {\n    width: 20px; height: 20px; border-radius: 6px; flex: none; margin-top: 1px;\n    border: 1.5px solid var(--line-2); cursor: pointer;\n    display: grid; place-items: center;\n    transition: border-color .14s, background .14s;\n  }\n  .certify input { position: absolute; opacity: 0; pointer-events: none; }\n  .certify .box svg { width: 12px; height: 12px; opacity: 0; transform: scale(.6); transition: .16s; }\n  .certify:has(input:checked) .box { border-color: var(--accent); background: var(--accent); }\n  .certify:has(input:checked) .box svg { opacity: 1; transform: none; }\n  .certify label { font-size: 13.5px; color: var(--ink-soft); cursor: pointer; line-height: 1.5; }\n  .certify label b { color: var(--ink); font-weight: 600; }\n\n  /* ---------- Footer nav ---------- */\n  .nav {\n    position: sticky; bottom: 0;\n    margin-top: 34px;\n    background: linear-gradient(transparent, var(--bg) 36%);\n    padding-top: 22px;\n    display: flex; align-items: center; justify-content: space-between; gap: 14px;\n  }\n  .btn {\n    font-family: var(--sans); font-size: 15px; font-weight: 600;\n    border-radius: 11px; padding: 12px 22px;\n    cursor: pointer; border: 1px solid transparent;\n    transition: background .15s, border-color .15s, transform .08s, box-shadow .15s, color .15s;\n    display: inline-flex; align-items: center; gap: 9px;\n  }\n  .btn:active { transform: translateY(1px); }\n  .btn-primary { background: var(--accent); color: #fff; }\n  .btn-primary:hover { background: var(--accent-h); }\n  .btn-primary:disabled { background: var(--line-2); color: var(--faint); cursor: not-allowed; }\n  .btn-ghost { background: transparent; color: var(--ink-soft); border-color: transparent; padding-left: 8px; }\n  .btn-ghost:hover { color: var(--ink); }\n  .btn-ghost.hidden { visibility: hidden; }\n  .btn .arr { font-family: var(--mono); font-weight: 500; }\n\n  .err-note {\n    color: oklch(54% 0.16 22); font-size: 13px; font-family: var(--mono);\n    margin-top: 14px; display: none;\n  }\n  .err-note.show { display: block; }\n  .field.invalid, .choices.invalid .opt { border-color: oklch(70% 0.14 22) !important; }\n\n  /* ---------- Success ---------- */\n  .success { text-align: center; padding-top: 36px; }\n  .seal {\n    width: 64px; height: 64px; border-radius: 50%;\n    background: var(--ok-sf); color: var(--ok);\n    display: grid; place-items: center; margin: 0 auto 26px;\n    animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both;\n  }\n  .seal svg { width: 30px; height: 30px; }\n  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }\n  .success h2 { font-size: 27px; letter-spacing: -.02em; margin: 0 0 14px; font-weight: 680; }\n  .success p { color: var(--ink-soft); font-size: 16px; max-width: 48ch; margin: 0 auto 12px; }\n  .success .ref {\n    font-family: var(--mono); font-size: 12.5px; color: var(--muted);\n    margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line);\n  }\n  .sign {\n    font-size: 15px; color: var(--ink); margin-top: 30px;\n  }\n  .sign b { font-weight: 600; }\n\n  .demo-banner {\n    display: none;\n    max-width: 720px; margin: 0 auto; width: 100%;\n    padding: 9px 24px;\n    background: var(--warn-sf);\n    border-bottom: 1px solid var(--warn-ln);\n    font-family: var(--mono); font-size: 11.5px; color: oklch(45% 0.08 70);\n    text-align: center;\n  }\n  .demo-banner.show { display: block; }\n  .demo-banner b { font-weight: 600; }\n\n  @media (max-width: 560px) {\n    .stage { padding: 24px 18px 90px; }\n    .topbar-inner { padding: 12px 18px; }\n    .brand-text span { display: none; }\n    .scale .opt { width: 38px; height: 38px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\">\n  <header class=\"topbar\">\n    <div class=\"topbar-inner\">\n      <div class=\"brand\">\n        <div class=\"mark\">PT<\u002Fdiv>\n        <div class=\"brand-text\">\n          <b>Landlord Information Request<\u002Fb>\n          <span>Prospective tenant pre-screening<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step-meta\" id=\"stepMeta\">Introduction<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"demo-banner\" id=\"demoBanner\">\n    <b>DEMO MODE<\u002Fb> — no Formspree endpoint configured. Submitting will offer a downloadable copy instead of emailing. See the CONFIG note in the file.\n  <\u002Fdiv>\n\n  <main class=\"stage\">\n    <form id=\"form\" novalidate=\"\">\n\n      <!-- ============ INTRO ============ -->\n      <section class=\"panel active intro\" data-panel=\"intro\" data-screen-label=\"Intro\">\n        <div class=\"eyebrow\">Before we schedule a tour<\u002Fdiv>\n        <h1>The evaluation process is not one‑sided.<\u002Fh1>\n        <p class=\"lede\">As prospective tenants, we recognize that landlords must evaluate applicants before entering a lease. We believe it is equally reasonable for tenants to evaluate the landlord, the property, and the management practices before investing further time. <strong>Just as landlords assess prospective tenants, tenants assess prospective landlords.<\u002Fstrong><\u002Fp>\n        <p class=\"lede\">Please provide brief, candid responses below. Completion does not guarantee further consideration; we reserve the right to discontinue at any point. Your answers help us decide whether to proceed to a tour.<\u002Fp>\n        <div class=\"meta-row\">\n          <span class=\"chip\"><i><\u002Fi>15 questions · 5 sections<\u002Fspan>\n          <span class=\"chip\"><i><\u002Fi>About 3 minutes<\u002Fspan>\n          <span class=\"chip\"><i><\u002Fi>Responses kept confidential<\u002Fspan>\n        <\u002Fdiv>\n        <hr class=\"rule\">\n        <div class=\"nav\" style=\"background:none;margin-top:6px;padding-top:0;\">\n          <span><\u002Fspan>\n          <button type=\"button\" class=\"btn btn-primary\" data-go=\"next\">Begin questionnaire <span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ IDENTIFY ============ -->\n      <section class=\"panel\" data-panel=\"identify\" data-screen-label=\"Your details\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">●<\u002Fspan> Your details<\u002Fdiv>\n          <h2>Who are we corresponding with?<\u002Fh2>\n          <p>So we can match your responses to the right property and reply to you directly.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">Your name<\u002Fdiv><\u002Fdiv>\n          <input class=\"field\" type=\"text\" name=\"id_name\" data-req=\"\" placeholder=\"First and last name\" autocomplete=\"name\">\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">Role <span class=\"opt-mark\">optional<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"choices\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"id_role\" value=\"Owner / landlord\"><span class=\"dot\"><\u002Fspan>Owner / landlord<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"id_role\" value=\"Property manager\"><span class=\"dot\"><\u002Fspan>Property manager<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"id_role\" value=\"Leasing agent\"><span class=\"dot\"><\u002Fspan>Leasing agent<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"id_role\" value=\"Other\"><span class=\"dot\"><\u002Fspan>Other<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">Company or management firm <span class=\"opt-mark\">optional<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <input class=\"field\" type=\"text\" name=\"id_company\" placeholder=\"If applicable\" autocomplete=\"organization\">\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">How can we reach you?<\u002Fdiv><\u002Fdiv>\n          <div class=\"q-help\">We'll use this to follow up about scheduling a tour.<\u002Fdiv>\n          <div class=\"grid2\">\n            <input class=\"field\" type=\"email\" name=\"id_email\" data-req=\"\" placeholder=\"Email address\" autocomplete=\"email\">\n            <input class=\"field\" type=\"tel\" name=\"id_phone\" placeholder=\"Phone (optional)\" autocomplete=\"tel\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">Which property is this about?<\u002Fdiv><\u002Fdiv>\n          <div class=\"q-help\">The address or unit you're inviting us to tour.<\u002Fdiv>\n          <input class=\"field\" type=\"text\" name=\"id_property\" data-req=\"\" placeholder=\"Property address or unit\" autocomplete=\"street-address\">\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">—<\u002Fspan><div class=\"q-body\">Listing link <span class=\"opt-mark\">optional<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"q-help\">Zillow, Apartments.com, or wherever the unit is posted.<\u002Fdiv>\n          <input class=\"field\" type=\"url\" name=\"id_listing\" placeholder=\"https://\" inputmode=\"url\">\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ SECTION 1 ============ -->\n      <section class=\"panel\" data-panel=\"section\" data-screen-label=\"Section 1\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">01 / 05<\u002Fspan> Maintenance &amp; Responsiveness<\u002Fdiv>\n          <h2>How the property is cared for<\u002Fh2>\n          <p>Who fixes things, and how quickly.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">01<\u002Fspan><div class=\"q-body\">Who is responsible for maintenance requests at this property?<\u002Fdiv><\u002Fdiv>\n          <div class=\"q-help\">e.g. the owner directly, an on-site manager, or a third-party management company.<\u002Fdiv>\n          <input class=\"field\" type=\"text\" name=\"q1_maintenance_owner\" data-req=\"\" placeholder=\"Describe who handles repairs\">\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">02<\u002Fspan><div class=\"q-body\">Typical response time for <em>emergency<\u002Fem> maintenance issues<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q2_emergency_time\" value=\"Under 1 hour\"><span class=\"dot\"><\u002Fspan>Under 1 hour<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q2_emergency_time\" value=\"Under 24 hours\"><span class=\"dot\"><\u002Fspan>Under 24 hours<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q2_emergency_time\" value=\"Under 72 hours\"><span class=\"dot\"><\u002Fspan>Under 72 hours<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q2_emergency_time\" value=\"Longer than 72 hours\"><span class=\"dot\"><\u002Fspan>Longer<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">03<\u002Fspan><div class=\"q-body\">Typical response time for <em>non-emergency<\u002Fem> maintenance issues<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q3_routine_time\" value=\"Under 24 hours\"><span class=\"dot\"><\u002Fspan>Under 24 hours<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q3_routine_time\" value=\"Under 72 hours\"><span class=\"dot\"><\u002Fspan>Under 72 hours<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q3_routine_time\" value=\"Under 1 week\"><span class=\"dot\"><\u002Fspan>Under 1 week<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q3_routine_time\" value=\"Longer than 1 week\"><span class=\"dot\"><\u002Fspan>Longer<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ SECTION 2 ============ -->\n      <section class=\"panel\" data-panel=\"section\" data-screen-label=\"Section 2\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">02 / 05<\u002Fspan> Deposits &amp; Fees<\u002Fdiv>\n          <h2>Money held and money owed<\u002Fh2>\n          <p>How deposits are returned, and what costs go beyond rent.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">04<\u002Fspan><div class=\"q-body\">What is your standard process for returning security deposits at move-out?<\u002Fdiv><\u002Fdiv>\n          <textarea class=\"field\" name=\"q4_deposit_process\" data-req=\"\" placeholder=\"Walk-through, timeline, itemized deductions, etc.\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">05<\u002Fspan><div class=\"q-body\">Over the past two years, approximately what share of security deposits have you returned in full?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q5_deposit_returned\" value=\"100%\"><span class=\"dot\"><\u002Fspan>100%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q5_deposit_returned\" value=\"90-99%\"><span class=\"dot\"><\u002Fspan>90–99%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q5_deposit_returned\" value=\"75-89%\"><span class=\"dot\"><\u002Fspan>75–89%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q5_deposit_returned\" value=\"Below 75%\"><span class=\"dot\"><\u002Fspan>Below 75%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q5_deposit_returned\" value=\"Prefer not to say\"><span class=\"dot\"><\u002Fspan>Prefer not to say<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">06<\u002Fspan><div class=\"q-body\">Beyond rent, utilities, and the security deposit, what fees should a tenant expect during the lease?<\u002Fdiv><\u002Fdiv>\n          <div class=\"q-help\">Application, pet, parking, administrative, late, or any recurring fees.<\u002Fdiv>\n          <textarea class=\"field\" name=\"q6_other_fees\" data-req=\"\" placeholder=\"List all expected fees, or write &quot;None.&quot;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ SECTION 3 ============ -->\n      <section class=\"panel\" data-panel=\"section\" data-screen-label=\"Section 3\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">03 / 05<\u002Fspan> Property Condition &amp; Disclosure<\u002Fdiv>\n          <h2>The state of the unit<\u002Fh2>\n          <p>What we'd find out eventually — disclosed up front.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">07<\u002Fspan><div class=\"q-body\">Has the property experienced water intrusion, mold, pest infestation, or major mechanical/appliance failure in the last five years?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\" data-reveal=\"r7\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q7_defects\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q7_defects\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"reveal\" id=\"r7\">\n            <textarea class=\"field\" name=\"q7_defects_detail\" placeholder=\"Please describe what happened and how it was resolved.\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">08<\u002Fspan><div class=\"q-body\">Are all advertised listing photos less than 12 months old?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q8_photos_current\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q8_photos_current\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q8_photos_current\" value=\"Unsure\"><span class=\"dot\"><\u002Fspan>Unsure<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">09<\u002Fspan><div class=\"q-body\">Are all appliances currently in working order?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\" data-reveal=\"r9\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q9_appliances\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q9_appliances\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"reveal\" id=\"r9\">\n            <input class=\"field\" type=\"text\" name=\"q9_appliances_detail\" placeholder=\"Which appliances, and the expected resolution?\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">10<\u002Fspan><div class=\"q-body\">Please disclose any known issues a reasonable tenant might discover after moving in that aren't visible in the listing photos.<\u002Fdiv><\u002Fdiv>\n          <textarea class=\"field\" name=\"q10_disclosure\" data-req=\"\" placeholder=\"Noise, parking, neighbors, quirks, pending repairs — or write &quot;None known.&quot;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ SECTION 4 ============ -->\n      <section class=\"panel\" data-panel=\"section\" data-screen-label=\"Section 4\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">04 / 05<\u002Fspan> Track Record &amp; References<\u002Fdiv>\n          <h2>Your history with tenants<\u002Fh2>\n          <p>Retention, references, and any disputes.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">11<\u002Fspan><div class=\"q-body\">Can you provide references from one or more current or former tenants?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q11_references\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q11_references\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">12<\u002Fspan><div class=\"q-body\">Over the past two years, approximately what share of tenants renewed their leases?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices\" data-req=\"\" role=\"radiogroup\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q12_renewal_rate\" value=\"Over 75%\"><span class=\"dot\"><\u002Fspan>Over 75%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q12_renewal_rate\" value=\"50-75%\"><span class=\"dot\"><\u002Fspan>50–75%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q12_renewal_rate\" value=\"25-49%\"><span class=\"dot\"><\u002Fspan>25–49%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q12_renewal_rate\" value=\"Under 25%\"><span class=\"dot\"><\u002Fspan>Under 25%<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q12_renewal_rate\" value=\"Prefer not to say\"><span class=\"dot\"><\u002Fspan>Prefer not to say<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">13<\u002Fspan><div class=\"q-body\">Have you ever been sued by a tenant, or had a judgment entered against you relating to housing, habitability, or tenant rights?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\" data-reveal=\"r13\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q13_litigation\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q13_litigation\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"reveal\" id=\"r13\">\n            <textarea class=\"field\" name=\"q13_litigation_detail\" placeholder=\"Please explain the circumstances and outcome.\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ SECTION 5 ============ -->\n      <section class=\"panel\" data-panel=\"section\" data-screen-label=\"Section 5\">\n        <div class=\"sec-head\">\n          <div class=\"sec-kicker\"><span class=\"ix\">05 / 05<\u002Fspan> Communication &amp; Professionalism<\u002Fdiv>\n          <h2>How you treat prospective tenants<\u002Fh2>\n          <p>The leasing process is the first sign of the relationship.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">14<\u002Fspan><div class=\"q-body\">Do you require any deposit, fee, application payment, or identity verification <em>before<\u002Fem> a prospective tenant can view the property?<\u002Fdiv><\u002Fdiv>\n          <div class=\"choices yn\" data-req=\"\" role=\"radiogroup\" data-reveal=\"r14\">\n            <label class=\"opt\"><input type=\"radio\" name=\"q14_pre_showing\" value=\"Yes\"><span class=\"dot\"><\u002Fspan>Yes<\u002Flabel>\n            <label class=\"opt\"><input type=\"radio\" name=\"q14_pre_showing\" value=\"No\"><span class=\"dot\"><\u002Fspan>No<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"reveal\" id=\"r14\">\n            <input class=\"field\" type=\"text\" name=\"q14_pre_showing_detail\" placeholder=\"What is required, and why?\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">15<\u002Fspan><div class=\"q-body\">On a scale of 1–10, how confident are you that your leasing process demonstrates respect for prospective tenants' time?<\u002Fdiv><\u002Fdiv>\n          <div class=\"scale\" data-req=\"\" role=\"radiogroup\" id=\"scale15\">\n            <!-- filled by JS -->\n          <\u002Fdiv>\n          <div class=\"scale-ends\"><span>1 · Not confident<\u002Fspan><span>Very confident · 10<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"q\">\n          <div class=\"q-label\"><span class=\"q-num\">16<\u002Fspan><div class=\"q-body\">Anything that distinguishes your management approach from other rentals currently available in the area? <span class=\"opt-mark\">optional<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <textarea class=\"field\" name=\"q16_distinguish\" placeholder=\"Optional — tell us what sets you apart.\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div class=\"certify\">\n          <input type=\"checkbox\" id=\"certify\" name=\"certification\" value=\"Certified accurate\">\n          <label class=\"box\" for=\"certify\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Flabel>\n          <label for=\"certify\"><b>I certify<\u002Fb> that the information provided is accurate and complete to the best of my knowledge.<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ NAV (shared) ============ -->\n      <div class=\"nav\" id=\"navBar\" style=\"display:none;\">\n        <button type=\"button\" class=\"btn btn-ghost\" data-go=\"back\"><span class=\"arr\">←<\u002Fspan> Back<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-primary\" data-go=\"next\" id=\"nextBtn\">Continue <span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"err-note\" id=\"errNote\">Please answer the highlighted question(s) before continuing.<\u002Fdiv>\n\n      <!-- ============ SUCCESS ============ -->\n      <section class=\"panel success\" data-panel=\"success\" data-screen-label=\"Success\">\n        <div class=\"seal\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n        <h2>Thank you — your responses are in.<\u002Fh2>\n        <p>We have a lot of properties to see, but we'll be in touch with you shortly.<\u002Fp>\n        <div class=\"sign\">Regards,<br><b>The Prospective Tenants<\u002Fb><\u002Fdiv>\n        <div class=\"ref\" id=\"refLine\"><\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fform>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   CONFIG — replace with your Formspree endpoint to go live.\n   ============================================================ */\nconst FORMSPREE_ENDPOINT = \"https://formspree.io/f/xrevkejq\";\nconst IS_DEMO = FORMSPREE_ENDPOINT.includes(\"YOUR_FORM_ID\");\n\nconst form = document.getElementById('form');\nconst panels = [...form.querySelectorAll('.panel')];\nconst navBar = document.getElementById('navBar');\nconst nextBtn = document.getElementById('nextBtn');\nconst backBtn = form.querySelector('[data-go=\"back\"]');\nconst progressFill = document.getElementById('progressFill');\nconst stepMeta = document.getElementById('stepMeta');\nconst errNote = document.getElementById('errNote');\n\n// Navigable order: intro, your details, 5 sections, success\nconst order = ['intro','identify','section','section','section','section','section','success'];\nconst sectionTitles = ['Maintenance','Deposits & Fees','Condition','Track Record','Professionalism'];\n// Ordered list of the actual panel elements matching `order`\nconst sectionEls = [...form.querySelectorAll('[data-panel=\"section\"]')];\nconst navPanels = order.map((t, i) => {\n  if (t === 'intro')   return form.querySelector('[data-panel=\"intro\"]');\n  if (t === 'identify')return form.querySelector('[data-panel=\"identify\"]');\n  if (t === 'success') return form.querySelector('[data-panel=\"success\"]');\n  return sectionEls.shift();\n});\nconst LAST_INPUT = order.length - 2; // index of final section (triggers submit)\nlet idx = 0;\n\nif (IS_DEMO) document.getElementById('demoBanner').classList.add('show');\n\n// Build 1–10 scale\nconst scale = document.getElementById('scale15');\nfor (let i = 1; i <= 10; i++) {\n  const l = document.createElement('label');\n  l.className = 'opt';\n  l.innerHTML = `<input type=\"radio\" name=\"q15_respect_score\" value=\"${i}\" />${i}`;\n  scale.appendChild(l);\n}\n\n// Conditional reveals: show detail when \"Yes\"\nform.querySelectorAll('[data-reveal]').forEach(group => {\n  const target = document.getElementById(group.dataset.reveal);\n  group.addEventListener('change', e => {\n    const v = e.target.value;\n    const show = v === 'Yes';\n    target.classList.toggle('show', show);\n  });\n});\n\nfunction showPanel(i) {\n  idx = i;\n  panels.forEach(p => p.classList.remove('active'));\n  navPanels[i].classList.add('active');\n\n  const type = order[i];\n  const isIntro = type === 'intro';\n  const isSuccess = type === 'success';\n  navBar.style.display = (isIntro || isSuccess) ? 'none' : 'flex';\n  backBtn.classList.toggle('hidden', i <= 1);\n\n  // final input step -> submit label\n  nextBtn.innerHTML = (i === LAST_INPUT)\n    ? 'Submit responses <span class=\"arr\">&rarr;<\u002Fspan>'\n    : 'Continue <span class=\"arr\">&rarr;<\u002Fspan>';\n\n  // progress + meta\n  const pct = isSuccess ? 100 : (i / (order.length - 1)) * 100;\n  progressFill.style.width = pct + '%';\n  const secNo = order.slice(0, i + 1).filter(t => t === 'section').length;\n  stepMeta.textContent = isSuccess ? 'Complete'\n    : isIntro ? 'Introduction'\n    : type === 'identify' ? 'Your details'\n    : `Section ${secNo} of 5 · ${sectionTitles[secNo - 1]}`;\n\n  errNote.classList.remove('show');\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nfunction validateCurrent() {\n  const cur = navPanels[idx];\n  if (!cur) return true;\n  let ok = true;\n\n  cur.querySelectorAll('[data-req]').forEach(req => {\n    let filled;\n    if (req.classList.contains('choices')) {\n      filled = !!req.querySelector('input:checked');\n      req.classList.toggle('invalid', !filled);\n    } else { // text/textarea\n      filled = req.value.trim().length > 0;\n      if (filled && typeof req.checkValidity === 'function') filled = req.checkValidity();\n      req.classList.toggle('invalid', !filled);\n    }\n    if (!filled) { ok = false; }\n  });\n\n  errNote.classList.toggle('show', !ok);\n  if (!ok) window.scrollTo({ top: 0, behavior: 'smooth' });\n  return ok;\n}\n\n// clear invalid state on interaction\nform.addEventListener('input', e => {\n  const choices = e.target.closest('.choices');\n  if (choices) choices.classList.remove('invalid');\n  if (e.target.classList.contains('field')) e.target.classList.remove('invalid');\n});\n\nform.addEventListener('click', e => {\n  const btn = e.target.closest('[data-go]');\n  if (!btn) return;\n  const dir = btn.dataset.go;\n  if (dir === 'next') {\n    // validate when leaving an input step\n    if ((order[idx] === 'section' || order[idx] === 'identify') && !validateCurrent()) return;\n    if (idx === LAST_INPUT) { submitForm(); return; }\n    showPanel(idx + 1);\n  } else if (dir === 'back') {\n    showPanel(Math.max(0, idx - 1));\n  }\n});\n\nfunction collectData() {\n  const data = {};\n  const fd = new FormData(form);\n  for (const [k, v] of fd.entries()) data[k] = v;\n  data.certification = document.getElementById('certify').checked ? 'Certified accurate' : 'Not certified';\n  data._submitted_at = new Date().toLocaleString();\n  data._replyto = data.id_email || '';\n  const who = data.id_company || data.id_name || 'landlord';\n  const where = data.id_property ? ` — ${data.id_property}` : '';\n  data._subject = `Landlord pre-screening: ${who}${where}`;\n  return data;\n}\n\nasync function submitForm() {\n  nextBtn.disabled = true;\n  nextBtn.innerHTML = 'Submitting…';\n  const data = collectData();\n  const ref = 'PT-' + Date.now().toString(36).toUpperCase().slice(-6);\n\n  if (IS_DEMO) {\n    downloadJSON(data, ref);\n    finishSuccess(ref);\n    return;\n  }\n\n  try {\n    const res = await fetch(FORMSPREE_ENDPOINT, {\n      method: 'POST',\n      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },\n      body: JSON.stringify(data)\n    });\n    if (res.ok) finishSuccess(ref);\n    else throw new Error('Bad response');\n  } catch (err) {\n    // graceful fallback: still thank them, but keep a local copy\n    downloadJSON(data, ref);\n    finishSuccess(ref);\n  }\n}\n\nfunction finishSuccess(ref) {\n  nextBtn.disabled = false;\n  document.getElementById('refLine').textContent = 'Confirmation reference: ' + ref;\n  showPanel(order.length - 1);\n}\n\nfunction downloadJSON(data, ref) {\n  try {\n    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = `landlord-response-${ref}.json`;\n    document.body.appendChild(a); a.click(); a.remove();\n    URL.revokeObjectURL(url);\n  } catch (e) { /* no-op */ }\n}\n\nshowPanel(0);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
